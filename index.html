<script>
        // ដាក់ Link Web App របស់ Google Apps Script ទីនេះ
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwDFr5UkMhYZCIaXLtj8lTR4mjDImJ1kxU3RAGFTegWDmSfwNYfop42kWMHRdVVAF1L/exec"; 

        let myChart = null;
        let globalDistrictData = {};

        document.addEventListener("DOMContentLoaded", function() {
            loadData();
            updateRole();
        });

        function updateRole() {
            let gender = document.getElementById('genderSelect').value;
            let roleInput = document.getElementById('roleInput');
            roleInput.value = (gender === 'ស្រី') ? 'នាយិកាសាលា' : 'នាយកសាលា';
        }

        function showToast(message, isError = false) {
            let toastEl = document.getElementById('liveToast');
            let toastBody = document.getElementById('toastMessage');
            toastBody.innerText = message;
            toastEl.className = `toast align-items-center text-white ${isError ? 'bg-danger' : 'bg-success'} border-0`;
            let toast = new bootstrap.Toast(toastEl);
            toast.show();
        }

        function loadData() {
            document.getElementById('tableData').innerHTML = `<tr><td colspan="10" class="text-center py-5 text-muted"><i class="fa-solid fa-spinner fa-spin me-2"></i>កំពុងទាញទិន្នន័យ...</td></tr>`;

            fetch(WEB_APP_URL + "?action=getData")
                .then(response => response.json())
                .then(res => {
                    if (!res || res.status === "error") {
                        showToast("កំហុសទាញទិន្នន័យ៖ " + (res ? res.message : "មិនមានការឆ្លើយតប"), true);
                        return;
                    }

                    document.getElementById('stat-total').innerText = res.stats.total;
                    document.getElementById('stat-certified').innerText = res.stats.certified;
                    document.getElementById('stat-pending').innerText = res.stats.pending;

                    globalDistrictData = res.districtSummary || {};
                    renderChart(globalDistrictData);

                    let rows = res.data;
                    let tbody = document.getElementById('tableData');
                    tbody.innerHTML = "";

                    if (!rows || rows.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="10" class="text-center text-muted py-5">ពុំទាន់មានទិន្នន័យនៅក្នុងតារាងនៅឡើយទេ</td></tr>`;
                        return;
                    }

                    rows.forEach((r, index) => {
                        let rawDate = r[3] || '';
                        let formattedDate = rawDate;
                        if (rawDate) {
                            let parts = rawDate.split('-');
                            if (parts.length === 3) {
                                formattedDate = `${parts[2]}/${parts[1]}/${parts[0]}`;
                            }
                        }

                        let certVal = String(r[7] || "").trim().toUpperCase();
                        let isCertified = (certVal === "TRUE" || certVal === "☑" || certVal === "✔" || certVal === "មាន" || certVal === "1");
                        let certBadge = isCertified ? 
                            '<span class="badge-status-yes"><i class="fa-solid fa-circle-check me-1"></i>មាន</span>' : 
                            '<span class="badge-status-no"><i class="fa-solid fa-circle-xmark me-1"></i>អត់</span>';

                        let tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td class="text-center fw-bold text-muted">${index + 1}</td>
                            <td><b class="text-dark">${r[1] || ''}</b></td>
                            <td class="text-center">${r[2] || ''}</td>
                            <td class="text-center">${formattedDate}</td>
                            <td>${r[4] || ''}</td>
                            <td><span class="fw-semibold text-primary">${r[5] || ''}</span></td>
                            <td><span class="badge bg-light text-dark border">${r[6] || ''}</span></td>
                            <td class="text-center">${certBadge}</td>
                            <td>${r[8] || ''}</td>
                            <td class="text-center">${r[9] || ''}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                })
                .catch(err => {
                    showToast("កំហុស Server៖ " + err.message, true);
                });
        }

        function renderChart(districtSummary) {
            let districts = Object.keys(districtSummary);
            let counts = districts.map(d => districtSummary[d].totalCert);

            let canvas = document.getElementById('districtChart');
            let ctx = canvas.getContext('2d');
            if (myChart) myChart.destroy();

            let gradient = ctx.createLinearGradient(0, 0, 0, 300);
            gradient.addColorStop(0, '#6366f1');
            gradient.addColorStop(1, '#4338ca');

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: districts.length > 0 ? districts : ['ពុំទាន់មានទិន្នន័យ'],
                    datasets: [{
                        label: 'ចំនួនគ្រូបានរៀន ៤ក្រេឌីត',
                        data: counts.length > 0 ? counts : [0],
                        backgroundColor: gradient,
                        borderColor: '#312e81',
                        borderWidth: 1,
                        borderRadius: 8,
                        borderSkipped: false,
                        barPercentage: 0.4,
                        categoryPercentage: 0.5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    onClick: function(evt, elements) {
                        if (elements.length > 0) {
                            showSchoolDetails(districts[elements[0].index]);
                        }
                    },
                    scales: {
                        y: { beginAtZero: true, ticks: { stepSize: 1, precision: 0 } },
                        x: { grid: { display: false } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        function showSchoolDetails(districtName) {
            let container = document.getElementById('schoolDetailContainer');
            let titleEl = document.getElementById('selectedDistrictTitle');
            let listEl = document.getElementById('schoolList');
            let districtData = globalDistrictData[districtName];
            
            if (!districtData || !districtData.schools) {
                container.style.display = 'none';
                return;
            }

            titleEl.innerHTML = `<i class="fa-solid fa-school me-2"></i>សាលារៀនក្នុងស្រុក "${districtName}" (សរុបអ្នកបានរៀន៖ ${districtData.totalCert} នាក់)`;
            listEl.innerHTML = "";

            for (let schoolName in districtData.schools) {
                let li = document.createElement('li');
                li.className = "mb-1";
                li.innerHTML = `<b>${schoolName}</b>: <span class="badge bg-success">${districtData.schools[schoolName]} នាក់</span>`;
                listEl.appendChild(li);
            }
            container.style.display = 'block';
        }

        document.getElementById('dataForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin me-2"></i>កំពុងរក្សាទុក...`;

            let formData = {
                name: this.name.value,
                gender: this.gender.value,
                dob: this.dob.value,
                role: this.role.value,
                school: this.school.value,
                district: this.district.value,
                cert: this.cert.checked ? 'true' : 'false',
                applied: this.applied.value,
                phone: this.phone.value
            };

            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify(formData)
            })
            .then(res => res.json())
            .then(res => {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-floppy-disk me-2"></i>រក្សាទុកទិន្នន័យ`;
                if (res && res.status === "error") {
                    showToast(res.message, true);
                    return;
                }
                showToast("បានរក្សាទុកទិន្នន័យដោយជោគជ័យ!");
                document.getElementById('dataForm').reset();
                updateRole();
                document.getElementById('schoolDetailContainer').style.display = 'none';
                loadData();
            })
            .catch(err => {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-floppy-disk me-2"></i>រក្សាទុកទិន្នន័យ`;
                showToast("កំហុស Server៖ " + err.message, true);
            });
        });
    </script>
